<!doctype html>
<!--
  Réplica da janela do NeyZap (tema Grafite) com contatos e mensagens inventados,
  para os prints do README. Nenhum dado real: o WhatsApp Web só mostraria conversas
  de verdade. Gerar: scripts/readme-prints.sh (?view=wide|compact|chat|split|read|menu).
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #121315; --side: #17181b; --card: #1a1b1f; --sel: #22242a; --line: #24262a;
    --ghost: #33363c; --text: #d8d9dc; --muted: #9a9ca3; --dim: #6e7179;
    --accent: #c6ff3d; --on-accent: #111; --in: #1f2125; --out: #243014; --accent-bg: #1c2410;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--text); padding: 28px; }
  svg { display: block; }

  .win { width: var(--w); height: var(--h); background: var(--side); border-radius: 12px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; box-shadow: 0 0 0 .5px #000, 0 0 0 1px #ffffff14 inset, 0 22px 60px #0009; }

  /* Barra de título com as guias (nativas no app) */
  .titlebar { height: 38px; flex: none; display: flex; align-items: center; padding: 0 12px 0 14px; gap: 2px; }
  .lights { display: flex; gap: 8px; margin-right: 14px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .tab { flex: none; white-space: nowrap; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; border-radius: 7px; color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .tab.on { background: var(--sel); color: #fff; }
  .tab .ini { width: 18px; height: 18px; border-radius: 4.5px; background: var(--ghost); color: var(--text); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
  .tab.on .ini { background: var(--accent); color: var(--on-accent); }
  .tab.off { opacity: .4; }
  .badge { min-width: 16px; height: 16px; padding: 0 4.5px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
  .badge.arch { background: var(--ghost); color: var(--muted); gap: 3px; display: flex; align-items: center; }
  .x { width: 16px; color: var(--dim); font-size: 11px; text-align: center; }
  .plus { width: 26px; color: var(--dim); display: grid; place-items: center; }
  .spacer { flex: 1; }
  .tool { width: 28px; color: var(--dim); display: grid; place-items: center; }
  .tool.on { color: var(--accent); }

  .body { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--line); }

  /* Trilho */
  .rail { width: 64px; flex: none; background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 10px 0 14px; gap: 6px; }
  .rail .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); position: relative; }
  .rail .ico.on { background: var(--sel); color: var(--text); }
  .rail .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .rail .me { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }

  /* Lista */
  .list { width: var(--list, 420px); flex: none; background: var(--bg); display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  .list.full { flex: 1; width: auto; border-right: 0; }
  .lhead { height: 64px; display: flex; align-items: center; padding: 0 16px 0 20px; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: -.3px; color: #fff; flex: 1; }
  .logo b { color: var(--accent); font-weight: 700; }
  .kebab { color: var(--muted); margin-right: 14px; }
  .new { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
  .search { margin: 0 16px; height: 40px; border-radius: 20px; background: var(--card); display: flex; align-items: center; gap: 12px; padding: 0 16px; color: var(--muted); font-size: 14.5px; white-space: nowrap; overflow: hidden; }
  .search svg { flex: none; }
  .search span { overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 8px; padding: 12px 16px 6px; overflow: hidden; }
  .chip { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--ghost); color: var(--muted); font-size: 14px; font-weight: 500; display: grid; place-items: center; white-space: nowrap; }
  .chip.on { background: var(--accent-bg); border-color: var(--accent-bg); color: #e3ff9e; }
  .archrow { height: 50px; display: flex; align-items: center; gap: 22px; padding: 0 26px; color: var(--muted); font-size: 16px; }
  .archrow span { flex: 1; }
  .archrow small { font-size: 12px; }
  .rows { flex: 1; overflow: hidden; }
  .row { height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 14px; margin: 0 8px; border-radius: 10px; position: relative; }
  .row.on { background: var(--sel); }
  .row.unread { padding-left: 46px; }
  .rd { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); opacity: .75; }
  .rd.hover { background: var(--accent); color: var(--on-accent); opacity: 1; }
  .tip { position: absolute; left: 40px; top: 46px; z-index: 2; background: #2c2d31; color: #e8e8ea; font-size: 12px; padding: 4px 8px; border-radius: 5px; box-shadow: 0 0 0 .5px #000, 0 6px 16px #0008; white-space: nowrap; }
  .av { width: 49px; height: 49px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 18px; font-weight: 600; }
  .meta { flex: 1; min-width: 0; }
  .l1, .l2 { display: flex; align-items: center; gap: 8px; }
  .name { flex: 1; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { font-size: 12px; color: var(--muted); }
  .time.hot { color: var(--accent); }
  .prev { flex: 1; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .tick { color: var(--accent); display: inline-block; vertical-align: -1px; margin-right: 3px; }
  .ub { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; display: grid; place-items: center; }

  /* Conversa */
  .chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
  .chead { height: 60px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--side); border-bottom: 1px solid var(--line); }
  .chead .back { color: var(--muted); margin-right: -2px; }
  .chead .av { width: 40px; height: 40px; font-size: 15px; }
  .chead .t { flex: 1; min-width: 0; }
  .chead .t div { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chead .t small { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .chead .ic { color: var(--muted); margin-left: 18px; flex: none; }
  .msgs { flex: 1; padding: 18px var(--gutter, 62px) 10px; display: flex; flex-direction: column; gap: 3px; justify-content: flex-end; }
  .day { align-self: center; background: var(--card); color: var(--muted); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; margin-bottom: 10px; }
  .b { max-width: var(--bubble, 65%); padding: 6px 9px 7px; border-radius: 8px; font-size: 14.2px; color: var(--text); position: relative; }
  .b.in { align-self: flex-start; background: var(--in); }
  .b.out { align-self: flex-end; background: var(--out); }
  .b.first { margin-top: 9px; }
  .b .who { display: block; font-size: 12.8px; font-weight: 600; margin-bottom: 1px; }
  .b .s { float: right; margin: 6px 0 -4px 10px; font-size: 11px; color: var(--muted); display: flex; gap: 3px; align-items: center; }
  .b.out .s .tick { margin: 0; }
  .compose { height: 62px; flex: none; display: flex; align-items: center; padding: 0 14px 10px; }
  .pill { flex: 1; height: 46px; border-radius: 23px; background: var(--card); display: flex; align-items: center; gap: 16px; padding: 0 16px; color: var(--muted); }
  .pill span { flex: 1; font-size: 15px; }

  /* Menu nativo (clique direito na guia) */
  .menu { position: absolute; z-index: 5; min-width: 236px; padding: 5px; border-radius: 8px; background: #2a2b2ef2;
    box-shadow: 0 0 0 .5px #000, 0 0 0 1px #ffffff1c inset, 0 12px 32px #000a; font-size: 13px; color: #e6e6e8; }
  .menu div { height: 22px; padding: 0 10px; border-radius: 4px; display: flex; align-items: center; }
  .menu div.hl { background: #3d6fd6; color: #fff; }
  .menu hr { border: 0; height: 1px; background: #ffffff1f; margin: 5px 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Tudo inventado: nomes, mensagens e horários.
  const view = new URLSearchParams(location.search).get('view') || 'wide';
  const tick = '<svg class="tick" width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m1 6 3.2 3.2L10 2.5M7.5 8.6l.6.6L14 2.5"/></svg>';
  const check = '<svg width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 5.2 3 3 6-6.5"/></svg>';
  const icon = {
    plus: (s = 13, w = 1.4) => `<svg width="${s}" height="${s}" viewBox="0 0 13 13"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/></svg>`,
    sbs: '<svg width="17" height="14" viewBox="0 0 17 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x=".7" y=".7" width="15.6" height="12.6" rx="2.5"/><path d="M8.5 1v12"/></svg>',
    pin: '<svg width="13" height="16" viewBox="0 0 13 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3.5 1.2h6M4.3 1.2v4.6L1.6 9.3h9.8L8.7 5.8V1.2M6.5 9.3v5.5"/></svg>',
    chats: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 3.5V6a2 2 0 0 1 2-2z"/><path d="M7 9h10M7 12.5h7" stroke="#22242a" stroke-width="1.8" stroke-linecap="round"/></svg>',
    call: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 3.5h3.2l1.6 4.2-2 1.4a11 11 0 0 0 5.1 5.1l1.4-2 4.2 1.6V17a2.6 2.6 0 0 1-2.8 2.5C9.5 19 5 14.5 4.5 7.3A2.6 2.6 0 0 1 5 3.5z"/></svg>',
    channels: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.5a8.5 8.5 0 1 1-4.6 15.6L3.5 20.5l1.3-3.8A8.5 8.5 0 0 1 12 3.5z" stroke-linejoin="round"/><circle cx="8.5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="15.5" cy="12" r="1" fill="currentColor"/></svg>',
    media: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="6.5" y="3.5" width="14" height="14" rx="2"/><path d="M3.5 7v11.5a2 2 0 0 0 2 2H17M9 14.5l3-3.5 2.5 2.5 1.5-1.5 2.5 2.5"/></svg>',
    kebab: '<svg class="kebab" width="4" height="18" viewBox="0 0 4 18" fill="currentColor"><circle cx="2" cy="2" r="2"/><circle cx="2" cy="9" r="2"/><circle cx="2" cy="16" r="2"/></svg>',
    search: (s = 17) => `<svg width="${s}" height="${s}" viewBox="0 0 17 17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5.5"/><path d="M11.2 11.2 16 16" stroke-linecap="round"/></svg>`,
    archive: '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1.5" y="2" width="15" height="14" rx="2"/><path d="M1.5 6.5h15M9 9v4.5M6.8 11.5 9 13.5l2.2-2"/></svg>',
    video: '<svg class="ic" width="24" height="18" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="1" y="2.5" width="15" height="13" rx="2.5"/><path d="m16 7.5 6-3.5v10l-6-3.5"/></svg>',
    back: '<svg class="back" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10H4M9.5 4.5 4 10l5.5 5.5"/></svg>',
    smile: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="8"/><circle cx="7.3" cy="8" r=".9" fill="currentColor"/><circle cx="12.7" cy="8" r=".9" fill="currentColor"/><path d="M6.5 12a4 4 0 0 0 7 0" stroke-linecap="round"/></svg>',
    mic: '<svg width="16" height="20" viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4.5" y="1" width="7" height="12" rx="3.5"/><path d="M1.5 9.5a6.5 6.5 0 0 0 13 0M8 16v3"/></svg>',
  };

  // [nome, inicial, fundo, cor, prévia, hora, não lidas]
  const pessoal = [
    ['Marina', 'M', '#35221e', '#fc9775', 'Chegando em 10 min! Já pede a pizza 🍕', '19:42', 2],
    ['Futebol de quinta ⚽', 'F', '#103529', '#25d366', 'Rafa: Quem confirma? Faltam 3', '19:37', 5],
    ['Família', 'F', '#242447', '#a791ff', 'Tia Lu: Domingo tem almoço aqui, hein', '19:30'],
    ['Carlos Lima', 'C', '#092642', '#53a6fd', tick + 'Fechado, te mando o PDF amanhã', '18:05'],
    ['Ana Souza', 'A', '#36192a', '#ff72a1', '📷 Foto', '16:20'],
    ['Condomínio Bloco B', 'C', '#362c1f', '#ffd279', 'Síndico: Reunião hoje às 20h no salão', '15:48'],
    ['Pedro Alves', 'P', '#092d2f', '#42c7b8', 'kkkkkk não acredito', 'Ontem'],
    ['Juliana', 'J', '#321622', '#fb5061', '🎤 Áudio (0:42)', 'Ontem'],
    ['Diego', 'D', '#35271e', '#dba685', tick + 'Valeu, chegou certinho!', 'sábado'],
  ];
  const trabalho = [
    ['Equipe Produto', 'E', '#092642', '#53a6fd', 'Bia: Subi a versão nova no staging 🚀', '10:12', 2],
    ['Fernanda · RH', 'F', '#36192a', '#ff72a1', 'Seu recibo de férias já está no portal', '09:40'],
    ['Daily 9h', 'D', '#103529', '#25d366', tick + 'Hoje fico com o card da busca', '09:05'],
    ['Studio Nobre (cliente)', 'S', '#362c1f', '#ffd279', 'Aprovado! Pode seguir com o layout', 'Ontem'],
    ['Thiago', 'T', '#092d2f', '#42c7b8', 'Me chama quando puder', 'Ontem'],
    ['Financeiro', 'F', '#242447', '#a791ff', '📄 Nota fiscal outubro.pdf', 'segunda'],
    ['Lívia', 'L', '#35221e', '#fc9775', tick + 'Combinado, até amanhã', 'segunda'],
  ];
  const marina = [
    ['in', 'Oi! Sexta tá de pé?', '19:30', 1],
    ['out', 'Tá sim! Que horas?', '19:31', 1],
    ['in', 'Umas 20h lá em casa', '19:31', 1],
    ['in', 'Pode levar o vinho? 🍷', '19:32'],
    ['out', 'Levo dois 😄', '19:33', 1],
    ['out', 'Quer que eu passe no mercado também?', '19:33'],
    ['in', 'Não precisa, já comprei tudo', '19:40', 1],
    ['in', 'Chegando em 10 min! Já pede a pizza 🍕', '19:42'],
  ];
  const futebol = [
    ['in', 'Quinta 20h na quadra de sempre, quem vai?', '19:20', 1, ['Rafa', '#53bdeb']],
    ['in', 'Tô dentro 🙋‍♂️', '19:22', 1, ['Bruno', '#fc9775']],
    ['in', 'Vou, mas chego 20h15', '19:25', 1, ['Lucas', '#a791ff']],
    ['out', 'Confirmado! Levo a bola ⚽', '19:30', 1],
    ['in', 'Alguém tem colete sobrando?', '19:34', 1, ['Bruno', '#fc9775']],
    ['in', 'Quem confirma? Faltam 3', '19:37', 1, ['Rafa', '#53bdeb']],
  ];

  const tabs = ({ on = ['P'], compact = false, sbs = false } = {}) => `
    <div class="titlebar">
      <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      ${[['P', 'Pessoal', 7], ['T', 'Trabalho', 2], ['I', 'Instagram', 0, true]].map(([i, n, u, off]) => {
        const sel = on.includes(i);
        return `<div class="tab${sel ? ' on' : ''}${off ? ' off' : ''}"><span class="ini">${i}</span>${sel || !compact ? `<span>${n}</span>` : ''}${u ? `<span class="badge">${u}</span>` : ''}${i === 'P' && view !== 'split' ? '<span class="badge arch">▤ 2</span>' : ''}${sel && on.length === 1 ? '<span class="x">✕</span>' : ''}</div>`;
      }).join('')}
      <div class="plus">${icon.plus()}</div>
      <div class="spacer"></div>
      ${compact ? '' : `<div class="tool${sbs ? ' on' : ''}">${icon.sbs}</div>`}
      <div class="tool">${icon.pin}</div>
    </div>`;

  const rail = (me = ['V', '#242447', '#a791ff']) => `
    <div class="rail">
      <div class="ico on">${icon.chats}</div>
      <div class="ico">${icon.call}</div>
      <div class="ico"><span class="dot"></span>${icon.channels}</div>
      <div class="spacer"></div>
      <div class="ico">${icon.media}</div>
      <div class="me" style="background:${me[1]};color:${me[2]}">${me[0]}</div>
    </div>`;

  const list = (chats, { full = false, selected = -1, chips = 5, read = false, arch = 2 } = {}) => `
    <div class="list${full ? ' full' : ''}">
      <div class="lhead"><div class="logo">ney<b>zap</b></div>${icon.kebab}<div class="new">${icon.plus(16, 2)}</div></div>
      <div class="search">${icon.search()}<span>Pesquisar ou começar uma nova conversa</span></div>
      <div class="chips">${['Tudo', 'Não lidas', 'Favoritas', 'Grupos', '+'].slice(0, chips).map((c, i) => `<div class="chip${i ? '' : ' on'}">${c}</div>`).join('')}</div>
      <div class="archrow">${icon.archive}<span>Arquivadas</span><small>${arch}</small></div>
      <div class="rows">${chats.map(([n, i, bg, fg, p, t, u], idx) => `
        <div class="row${idx === selected ? ' on' : ''}${read && u ? ' unread' : ''}">
          ${read && u ? `<div class="rd${idx === 0 ? ' hover' : ''}">${check}</div>${idx === 0 ? '<div class="tip">Marcar como lida</div>' : ''}` : ''}
          <div class="av" style="background:${bg};color:${fg}">${i}</div>
          <div class="meta">
            <div class="l1"><span class="name">${n}</span><span class="time${u ? ' hot' : ''}">${t}</span></div>
            <div class="l2"><span class="prev">${p}</span>${u ? `<span class="ub">${u}</span>` : ''}</div>
          </div>
        </div>`).join('')}</div>
    </div>`;

  const chat = (who, msgs, { back = false } = {}) => `
    <div class="chat">
      <div class="chead">
        ${back ? icon.back : ''}
        <div class="av" style="background:${who[2]};color:${who[3]}">${who[1]}</div>
        <div class="t"><div>${who[0]}</div><small>${who[4]}</small></div>
        ${back ? '' : icon.video}
        <span class="ic">${icon.search(18)}</span>
        <span class="ic">${icon.kebab}</span>
      </div>
      <div class="msgs"><div class="day">Hoje</div>${msgs.map(([k, t, h, first, from], idx) =>
        `<div class="b ${k}${first && idx ? ' first' : ''}">${from ? `<span class="who" style="color:${from[1]}">${from[0]}</span>` : ''}${t}<span class="s">${h}${k === 'out' ? tick : ''}</span></div>`).join('')}</div>
      <div class="compose"><div class="pill">${icon.plus(18, 1.7)}${icon.smile}<span>Digite uma mensagem</span>${icon.mic}</div></div>
    </div>`;

  const win = (w, h, inner, extra = '') => `<div class="win" style="--w:${w}px;--h:${h}px">${inner}${extra}</div>`;
  const MARINA = ['Marina', 'M', '#35221e', '#fc9775', 'online'];
  const FUTEBOL = ['Futebol de quinta ⚽', 'F', '#103529', '#25d366', 'Rafa, Bruno, Lucas, Você'];

  const views = {
    wide: () => win(1180, 760, tabs() + `<div class="body">${rail()}${list(pessoal, { selected: 0 })}${chat(MARINA, marina)}</div>`),
    compact: () => win(420, 740, tabs({ compact: true }) + `<div class="body">${rail()}${list(pessoal, { full: true, chips: 3 })}</div>`),
    chat: () => `<div style="--gutter:12px;--bubble:88%">` + win(420, 740, tabs({ compact: true }) + `<div class="body">${chat(FUTEBOL, futebol, { back: true })}</div>`) + '</div>',
    split: () => win(1180, 700, tabs({ on: ['P', 'T'], sbs: true }) + `<div class="body">
      <div class="pane">${rail()}${list(pessoal, { full: true, chips: 4 })}</div>
      <div class="pane">${rail(['V', '#092642', '#53a6fd'])}${list(trabalho, { full: true, chips: 4, arch: 1 })}</div></div>`),
    read: () => win(460, 462, tabs({ compact: true }) + `<div class="body">${rail()}${list(pessoal, { full: true, chips: 3, read: true })}</div>`),
    menu: () => win(560, 250, tabs() + `<div class="body">${rail()}${list(pessoal, { full: true })}</div>`,
      `<div class="menu" style="left:92px;top:34px"><div>Renomear guia</div><div>Limpar sessão (novo QR code)…</div><div class="hl">Desativar guia</div><hr><div>Fechar guia…</div></div>`),
  };
  document.getElementById('root').innerHTML = views[view]();
</script>
</body>
